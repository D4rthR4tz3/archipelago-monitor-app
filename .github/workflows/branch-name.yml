name: Validate Branch Name

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          branch = os.environ["BRANCH_NAME"]

          pattern = (
              r"^(?:main|master|develop|"
              r"(?:feat|fix|hotfix|release|chore|/)"
              r"[a-z0-9]+(?:\.[a-z0-9]+)*"
              r"(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)*)$"
          )

          if re.fullmatch(pattern, branch):
              print(f"Branch name is valid: {branch}")
              sys.exit(0)

          print(f"::error::Invalid branch name: {branch}")
          print(
              "Expected Conventional Branch 1.1.0 naming, "
              "e.g. feature/add-login-page or fix/header-bug."
          )
          sys.exit(1)
          PY
